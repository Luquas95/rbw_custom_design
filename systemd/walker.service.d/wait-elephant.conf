[Service]
# Walker si čte definice menu sám; bez stejného XDG_CONFIG_DIRS jako má elephant
# nenajde menu z tmpfs (Bitwarden) a spadne na "failed to get item layout".
# Cesta musí odpovídat elephant.service.d/tmpfs-menus.conf.
Environment=XDG_CONFIG_DIRS=%t/bitwarden-xdg:/etc/xdg
ExecStartPre=%h/.local/bin/wait-for-elephant
