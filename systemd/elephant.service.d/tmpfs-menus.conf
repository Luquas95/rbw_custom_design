[Service]
# Bitwarden menu (názvy složek a UUID položek) se generují na tmpfs, ne na disk.
# Elephant je najde přes XDG_CONFIG_DIRS; cesta musí odpovídat MENU_DIR
# v ~/.local/bin/bitwarden-generate-menus.
Environment=XDG_CONFIG_DIRS=%t/bitwarden-xdg:/etc/xdg
ExecStartPre=/usr/bin/install -d -m 700 %t/bitwarden-xdg %t/bitwarden-xdg/elephant %t/bitwarden-xdg/elephant/menus
