[Service]
# Elephant loguje "menu loaded=<cesta>" a "providers p=menus:gen-bitwarden-…"
# s názvy složek a UUID položek Bitwardenu.
# LogFilterPatterns= u uživatelských služeb journald nepoužije (ověřeno),
# proto se ty řádky filtrují už na výstupu procesu. Ostatní logy zůstávají.
# "exec" nechá elephanta jako hlavní proces služby.
SyslogIdentifier=elephant
ExecStart=
ExecStart=/usr/bin/bash -c "exec /usr/bin/elephant > >(grep --line-buffered -v -E 'menu loaded=|gen-bitwarden') 2>&1"

# Core dump by obsahoval menu (názvy/UUID z Bitwardenu) z paměti.
LimitCORE=0
