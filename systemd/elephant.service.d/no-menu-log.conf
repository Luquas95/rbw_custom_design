[Service]
# Elephant při startu zaloguje INFO "menu loaded=<cesta>" pro každý
# vygenerovaný soubor, tedy názvy složek a UUID položek Bitwardenu.
# LogFilterPatterns= u uživatelských služeb journald nepoužije (ověřeno),
# proto se ty řádky filtrují už na výstupu procesu. Ostatní logy zůstávají.
# "exec" nechá elephanta jako hlavní proces služby.
SyslogIdentifier=elephant
ExecStart=
ExecStart=/usr/bin/bash -c "exec /usr/bin/elephant > >(grep --line-buffered -v 'menu loaded=') 2>&1"
