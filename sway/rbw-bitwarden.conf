# Přidat do ~/.config/sway/config (include, nebo zkopírovat ručně).

bindsym $mod+b exec ~/.local/bin/bitwarden-launcher
bindsym $mod+Shift+g exec ~/.local/bin/bitwarden-generate
bindsym $mod+Shift+a exec ~/.local/bin/bitwarden-add

# pinentry-gtk nenastavuje dialog/modal hint, na který by Sway auto-floatoval,
# takže by se bez tohohle pravidla naklátil do tiling layoutu místo aby
# vyskočil nahoře jako heslový prompt.
for_window [app_id="pinentry-gtk"] floating enable, move position center
